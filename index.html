<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacktoberfest Code Galaxy</title>

    <style>
        body {
            margin: 0;
            background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 100%);
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #fff;
        }

        /* Music Toggle */
        .music-toggle-container {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            font: 12px 'Courier New', monospace;
            z-index: 50;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        .music-toggle input {
            appearance: none;
            width: 50px;
            height: 24px;
            background: #222;
            border-radius: 18px;
            position: relative;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        .music-toggle input::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #ff7b00;
            border-radius: 50%;
            transition: 0.3s ease;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .music-toggle input:checked {
            background: #00cc6a;
            box-shadow: 0 0 10px #ffffff;
        }

        .music-toggle input:checked::before {
            left: 28px;
            background: #00ff88;
            box-shadow: 0 0 10px #ffffff;
        }

        .music-toggle-container span {
            user-select: none;
        }

        /* Mouse Trail */
        .mouse-trail {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 999;
        }

        .trail-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 123, 0, 0.8);
            animation: fadeTrail 1.2s ease-out forwards;
        }

        .trail-particle.sparkle {
            background: rgba(255, 255, 255, 0.9);
            width: 4px;
            height: 4px;
            animation: fadeTrail 1s ease-out forwards;
        }

        .trail-particle.magic {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            width: 8px;
            height: 8px;
            animation: fadeTrail 2s ease-out forwards;
        }

        @keyframes fadeTrail {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.5); }
        }
    </style>
</head>

<body>
    <!-- Music Toggle -->
    <div class="music-toggle-container">
        <label class="music-toggle">
            <input type="checkbox" id="musicToggle">
        </label>
        <span>Music</span>
    </div>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="assets/bg_music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="title">HACKTOBERFEST 2025</div>
        <!-- Your other content here -->
    </div>

    <div class="mouse-trail"></div>

    <script>
        // Music Toggle Logic
        const musicToggle = document.getElementById('musicToggle');
        const bgMusic = document.getElementById('bgMusic');

        musicToggle.addEventListener('change', () => {
            if (musicToggle.checked) {
                bgMusic.play();
            } else {
                bgMusic.pause();
            }
        });

        // Interactive Mouse Trail
        const mouseTrailContainer = document.querySelector('.mouse-trail');
        let mouseX = 0, mouseY = 0, lastTrailTime = 0;
        const trailInterval = 50;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            const currentTime = Date.now();
            if (currentTime - lastTrailTime > trailInterval) {
                createTrailParticle(mouseX, mouseY);
                lastTrailTime = currentTime;
            }
        });

        function createTrailParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('trail-particle');

            const types = ['normal', 'sparkle', 'magic'];
            const type = types[Math.floor(Math.random() * types.length)];
            if (type === 'sparkle') particle.classList.add('sparkle');
            if (type === 'magic') particle.classList.add('magic');

            const offsetX = (Math.random() - 0.5) * 10;
            const offsetY = (Math.random() - 0.5) * 10;

            particle.style.left = `${x + offsetX}px`;
            particle.style.top = `${y + offsetY}px`;
            mouseTrailContainer.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, type === 'magic' ? 2000 : type === 'sparkle' ? 1000 : 1500);
        }

        document.addEventListener('click', (e) => {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    createTrailParticle(e.clientX, e.clientY);
                }, i * 20);
            }
        });

        document.addEventListener('mouseover', (e) => {
            if (e.target.classList.contains('pr') ||
                e.target.classList.contains('contributor') ||
                e.target.classList.contains('galactic-center')) {
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const particle = document.createElement('div');
                        particle.classList.add('trail-particle', 'magic');
                        particle.style.left = `${e.clientX + (Math.random() - 0.5) * 20}px`;
                        particle.style.top = `${e.clientY + (Math.random() - 0.5) * 20}px`;
                        mouseTrailContainer.appendChild(particle);
                        setTimeout(() => particle.remove(), 2000);
                    }, i * 50);
                }
            }
        });
    </script>
</body>
</html>
